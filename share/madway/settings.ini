[appearance]
title_height = 16
tile_gap = 2

[windows]
default_mode = floating
master_percent = 50

[input]
modifier = alt
repeat_rate = 25
repeat_delay = 600

[panel]
enabled = true
height = 24
metrics = true
clock = true

[controls]
volume_step = 5
brightness_step = 5

[wallpaper]
path =
mode = fill
color = #121418

[notifications]
enabled = true
indicators = true
timeout = 5000
width = 300
anchor = top-right

[sounds]
enabled = false
volume = 0.25
startup =
logout =
shutdown =

# Per-monitor profiles are saved by the Displays page, for example:
# [output:DP-1]
# enabled = true
# mode = preferred
# x = 0
# y = 0
# scale = 1.0
# transform = 0
