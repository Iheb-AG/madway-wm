[appearance]
theme = black
title_height = 14
tile_gap = 1

[windows]
default_mode = floating
master_percent = 50

[input]
focus_follows_mouse = false
modifier = alt
repeat_rate = 25
repeat_delay = 600

[panel]
position = top
enabled = true
height = 18
metrics = true
clock = true

[controls]
volume_step = 5
brightness_step = 5

[wallpaper]
# auto preserves older image-path behaviour; choose color or image explicitly.
type = auto
path =
mode = fill
color = #000000

[notifications]
enabled = true
indicators = true
timeout = 5000
width = 280
anchor = top-right

[sounds]
enabled = false
volume = 0.25
startup =
logout =
shutdown =

# Per-monitor profiles are saved by the Displays page, for example:
# [output:DP-1]
# enabled = true
# mode = preferred
# x = 0
# y = 0
# scale = 1.0
# transform = 0
