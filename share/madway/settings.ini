[appearance]
theme = black
title_height = 14
tile_gap = 1

[windows]
default_mode = floating
master_percent = 50
animate = true
animation_ms = 360

[motion]
version = 2

[desktop]
icons = true
# Empty uses the XDG Desktop directory, usually ~/Desktop.
folder =
icon_size = 40

[input]
focus_follows_mouse = false
modifier = alt
repeat_rate = 25
repeat_delay = 600

[keyboard]
# Empty layout preserves the original/backend keymap. Example: us,fr
layout =
variant =
options =

[mouse]
speed = 0.0
natural_scroll = false
left_handed = false
middle_emulation = false
accel_profile = default

[touchpad]
tap = true
tap_drag = true
drag_lock = false
disable_while_typing = true
natural_scroll = false
speed = 0.0
click_method = default

[workspaces]
animate = true
animation_ms = 420

[panel]
label = @user
# Use @user for the account name, or enter your own label.
position = top
enabled = true
height = 18
metrics = true
clock = true
tasks = icons

[dock]
enabled = true
autohide = true
animate = true
animation_ms = 240
position = bottom
icons_only = true
icon_size = 32
tray = true

[power]
show_battery = true
notifications = true
low_percent = 20
critical_percent = 10
# auto: suspend undocked; use external monitors with the built-in screen off.
# Other choices: suspend, ignore, system (leave lid policy to systemd-logind).
lid_action = suspend

[demoscene]
scene = classic
# Local folder containing assets/logo.png, assets/lightning.mp3 and act_or_die.wav.
assets =
sound = false
click_through = true

[locking]
before_sleep = true

[controls]
volume_step = 5
brightness_step = 5

[wallpaper]
# auto preserves older image-path behaviour; choose color or image explicitly.
type = auto
path =
mode = fill
color = #000000
# Slideshow: type=slideshow, source=folder or files, interval in seconds.
source = folder
folder =
images = []
interval = 300
# Disable rotation while retaining the chosen image/folder and interval.
slideshow_enabled = true

[notifications]
enabled = true
indicators = true
timeout = 5000
width = 280
anchor = top-right

[sounds]
enabled = false
volume = 0.25
startup =
logout =
shutdown =

# Per-monitor profiles are saved by the Displays page, for example:
# [output:DP-1]
# enabled = true
# mode = preferred
# x = 0
# y = 0
# scale = 1.0
# transform = 0
